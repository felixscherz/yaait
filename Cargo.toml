[package]
name = "yaait"
version = "0.3.0"
edition = "2024"
description = "Multi-instance AI usage tracker"
license = "MIT"
repository = "https://github.com/felixscherz/yaait"
homepage = "https://github.com/felixscherz/yaait"
readme = "README.md"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false }
directories = "6"
fs2 = "0.4"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rpassword = "7"
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
xz2 = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
httpmock = "0.8"

[profile.release]
strip = true
lto = "thin"

[profile.dist]
inherits = "release"
lto = "thin"
