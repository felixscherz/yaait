[package]
name = "yaait"
version = "0.2.3"
edition = "2024"
description = "Multi-instance AI usage tracker"
license = "MIT"
repository = "https://github.com/felixscherz/yaait"
homepage = "https://github.com/felixscherz/yaait"
readme = "README.md"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6"
dialoguer = { version = "0.12", default-features = false }
fs2 = "0.4"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
httpmock = "0.8"

[profile.release]
strip = true
lto = "thin"

[profile.dist]
inherits = "release"
lto = "thin"
